  <text x="72" y="612" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.55)">fintechfellow.org · Başvurular açık · 11 Haziran 2026</text>
